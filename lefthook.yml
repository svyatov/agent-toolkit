# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --verbose

    - name: validate-staged
      glob: "plugins/*"
      run: |
        claude plugin validate --strict . || exit 1
        for p in $(printf '%s\n' {staged_files} | cut -d/ -f1-2 | sort -u); do
          claude plugin validate --strict "$p" || exit 1
        done

    - name: whitespace
      run: git diff --cached --check

commit-msg:
  jobs:
    - name: conventional
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|chore|refactor)(\(.+\))?!?: .+' || { echo "Use Conventional Commits: type(scope): description"; exit 1; }
